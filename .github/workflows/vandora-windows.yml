name: Vandora Windows

# Bygger Vandoras klient (OTClient med Vandoras ikon) for Windows.
# Startas automatiskt vid push till grenen "vandora", eller manuellt under Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - vandora

permissions:
  contents: read
  packages: read

jobs:
  build-windows:
    uses: ./.github/workflows/reusable-build-windows.yml
    secrets: inherit
